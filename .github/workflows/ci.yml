name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run fmt -- --check

      - name: Check
        run: npm run check

      - name: Production artifact tests
        run: npm run test:production

  browser:
    name: Browser product flows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Standard browser scenarios
        run: npm run test:scenarios

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-scenario-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report
            test-results

  findings:
    name: Published-package findings
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:findings
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-package-findings
          if-no-files-found: ignore
          retention-days: 14
          path: artifacts/findings-*

  visual:
    name: Canonical visual census
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run pinned canonical image
        run: docker build -f Dockerfile.visual -t destroyer-visual . && docker run --name destroyer-visual-run destroyer-visual
      - name: Copy visual evidence
        if: always()
        run: docker cp destroyer-visual-run:/workspace/artifacts ./artifacts || true
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-census-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/visual-report
            test-results
